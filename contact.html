<form class="form" action="#" method="POST">
  <div class="form__group">
    <label class="form__label" for="form-name">Your Name</label>
    <input class="form__input" id="form-name" type="text" name="name" placeholder="Your name..." required>
  </div>
  <div class="form__group">
    <label class="form__label" for="form-email">Your Email</label>
    <input class="form__input" id="form-email" type="email" name="email" placeholder="Your email..." required>
  </div>
  <div class="form__group">
    <label class="form__label" for="form-text">Your Message</label>
    <textarea class="form__input" id="form-text" name="text" rows="6" placeholder="Your message..." required></textarea>
  </div>
  <div class="form__group">
    <button class="button button--primary" type="submit">Send Message</button>
  </div>
</form>
