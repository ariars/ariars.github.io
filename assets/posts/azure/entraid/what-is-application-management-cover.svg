<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b192e"/>
      <stop offset="50%" stop-color="#102a4e"/>
      <stop offset="100%" stop-color="#183b6b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2f6bff"/>
      <stop offset="100%" stop-color="#58a6ff"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 장식 원형 그리드 -->
  <circle cx="1050" cy="120" r="280" fill="#2f6bff" fill-opacity="0.12" filter="blur(60px)"/>
  <circle cx="150" cy="520" r="240" fill="#00d2b4" fill-opacity="0.08" filter="blur(60px)"/>

  <!-- 헤더 뱃지 -->
  <rect x="80" y="80" width="220" height="42" rx="21" fill="url(#badgeGrad)"/>
  <text x="190" y="107" text-anchor="middle" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="1">MICROSOFT ENTRA ID</text>

  <!-- 메인 타이틀 -->
  <text x="80" y="195" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="-1">애플리케이션 관리의 개념</text>
  <text x="80" y="250" font-size="24" font-weight="500" fill="#c3d4f5">업무용 프로그램을 한곳에 모아 연결하고, 안전하게 제어하는 체계</text>

  <!-- 하단 3개 핵심 영역 카드 -->
  <g transform="translate(80, 310)">
    <!-- 카드 1: 등록 및 통합 -->
    <rect x="0" y="0" width="320" height="230" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="24" fill="#2f6bff" fill-opacity="0.3"/>
    <text x="50" y="58" text-anchor="middle" font-size="22">🔌</text>
    <text x="50" y="115" font-size="22" font-weight="700" fill="#ffffff">등록과 통합</text>
    <text x="50" y="152" font-size="15" fill="#a5b9de" line-height="1.5">
      <tspan x="50" dy="0">외부 서비스와 사내 프로그램을</tspan>
      <tspan x="50" dy="24">중앙 시스템 한곳에 등록</tspan>
    </text>
  </g>

  <g transform="translate(440, 310)">
    <!-- 카드 2: 접속 및 권한 -->
    <rect x="0" y="0" width="320" height="230" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="24" fill="#00d2b4" fill-opacity="0.25"/>
    <text x="50" y="58" text-anchor="middle" font-size="22">🔑</text>
    <text x="50" y="115" font-size="22" font-weight="700" fill="#ffffff">접근과 권한 제어</text>
    <text x="50" y="152" font-size="15" fill="#a5b9de" line-height="1.5">
      <tspan x="50" dy="0">한 번의 로그인(SSO)과</tspan>
      <tspan x="50" dy="24">사용자별 권한 자동 배정</tspan>
    </text>
  </g>

  <g transform="translate(800, 310)">
    <!-- 카드 3: 보안과 감시 -->
    <rect x="0" y="0" width="320" height="230" rx="20" fill="url(#cardGrad)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="24" fill="#ff7043" fill-opacity="0.25"/>
    <text x="50" y="58" text-anchor="middle" font-size="22">🛡️</text>
    <text x="50" y="115" font-size="22" font-weight="700" fill="#ffffff">보안과 사용 감시</text>
    <text x="50" y="152" font-size="15" fill="#a5b9de" line-height="1.5">
      <tspan x="50" dy="0">다단계 인증과 접속 기록 추적으로</tspan>
      <tspan x="50" dy="24">안전하지 않은 접근 차단</tspan>
    </text>
  </g>
</svg>
