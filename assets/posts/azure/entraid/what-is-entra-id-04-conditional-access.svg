<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="960" height="440" rx="20" fill="#f6f7fb"/>
  <text x="480" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#22252b">조건부 액세스 — 상황 정보 → 정책 → 결정</text>

  <g transform="translate(40,80)">
    <rect width="270" height="310" rx="18" fill="#ffffff" stroke="#d9dce6"/>
    <text x="135" y="38" text-anchor="middle" font-size="17" font-weight="800" fill="#22252b">① 확인하는 상황 정보</text>
    <g font-size="15" fill="#4a4f5c">
      <text x="28" y="86">• 누가 접속하는지</text>
      <text x="28" y="128">• 어디에서 접속하는지</text>
      <text x="28" y="170">• 어떤 기기를 쓰는지</text>
      <text x="28" y="212">• 어떤 서비스에 들어가려는지</text>
      <text x="28" y="254">• 위험 신호가 있는지</text>
    </g>
  </g>

  <path d="M322 235 H392" stroke="#8a90a2" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <g transform="translate(405,140)">
    <rect width="170" height="190" rx="18" fill="#2f6bff"/>
    <text x="85" y="78" text-anchor="middle" font-size="18" font-weight="800" fill="#ffffff">② 정책</text>
    <text x="85" y="110" text-anchor="middle" font-size="14" fill="#dfe7ff">관리자가 미리</text>
    <text x="85" y="132" text-anchor="middle" font-size="14" fill="#dfe7ff">정해 둔 규칙</text>
  </g>

  <path d="M590 195 L660 125" stroke="#8a90a2" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M590 235 H660" stroke="#8a90a2" stroke-width="3" fill="none" marker-end="url(#a)"/>
  <path d="M590 275 L660 345" stroke="#8a90a2" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <g transform="translate(675,82)">
    <rect width="245" height="74" rx="16" fill="#e6f7ee" stroke="#9fdcb9"/>
    <text x="22" y="32" font-size="17" font-weight="800" fill="#1d7a46">허용</text>
    <text x="22" y="56" font-size="14" fill="#3d6b52">조건을 충족하면 그대로 접속</text>
  </g>
  <g transform="translate(675,198)">
    <rect width="245" height="74" rx="16" fill="#fff6e0" stroke="#f1d38a"/>
    <text x="22" y="32" font-size="17" font-weight="800" fill="#9a6a00">추가 확인 요구</text>
    <text x="22" y="56" font-size="14" fill="#7a6326">MFA 등을 거친 뒤 접속</text>
  </g>
  <g transform="translate(675,314)">
    <rect width="245" height="74" rx="16" fill="#fdeaea" stroke="#f1a9a9"/>
    <text x="22" y="32" font-size="17" font-weight="800" fill="#b02a2a">차단</text>
    <text x="22" y="56" font-size="14" fill="#8a3b3b">허용할 수 없는 상황이면 거부</text>
  </g>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a90a2"/>
    </marker>
  </defs>
</svg>
