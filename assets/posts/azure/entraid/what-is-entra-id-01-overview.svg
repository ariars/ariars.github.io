<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="960" height="440" rx="20" fill="#f6f7fb"/>
  <text x="480" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#22252b">Microsoft Entra ID의 위치</text>

  <!-- 접속하는 대상 -->
  <g transform="translate(40,90)">
    <rect width="220" height="290" rx="18" fill="#ffffff" stroke="#d9dce6"/>
    <text x="110" y="38" text-anchor="middle" font-size="17" font-weight="800" fill="#22252b">접속하려는 대상</text>
    <g font-size="16" fill="#4a4f5c">
      <rect x="24" y="64" width="172" height="54" rx="12" fill="#eef2ff"/><text x="110" y="97" text-anchor="middle">사용자 (사람)</text>
      <rect x="24" y="130" width="172" height="54" rx="12" fill="#eef2ff"/><text x="110" y="163" text-anchor="middle">기기 (PC, 휴대폰)</text>
      <rect x="24" y="196" width="172" height="54" rx="12" fill="#eef2ff"/><text x="110" y="229" text-anchor="middle">프로그램·서비스</text>
    </g>
  </g>

  <path d="M272 235 H352" stroke="#8a90a2" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <!-- Entra ID -->
  <g transform="translate(366,100)">
    <rect width="228" height="270" rx="20" fill="#2f6bff"/>
    <text x="114" y="46" text-anchor="middle" font-size="19" font-weight="800" fill="#ffffff">Microsoft Entra ID</text>
    <rect x="22" y="76" width="184" height="72" rx="14" fill="#ffffff" fill-opacity="0.16"/>
    <text x="114" y="106" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">인증</text>
    <text x="114" y="132" text-anchor="middle" font-size="14" fill="#dfe7ff">본인이 맞는지 확인</text>
    <rect x="22" y="164" width="184" height="72" rx="14" fill="#ffffff" fill-opacity="0.16"/>
    <text x="114" y="194" text-anchor="middle" font-size="17" font-weight="800" fill="#ffffff">권한 부여</text>
    <text x="114" y="220" text-anchor="middle" font-size="14" fill="#dfe7ff">사용 가능한 범위 결정</text>
  </g>

  <path d="M608 235 H688" stroke="#8a90a2" stroke-width="3" fill="none" marker-end="url(#a)"/>

  <!-- 리소스 -->
  <g transform="translate(700,90)">
    <rect width="220" height="290" rx="18" fill="#ffffff" stroke="#d9dce6"/>
    <text x="110" y="38" text-anchor="middle" font-size="17" font-weight="800" fill="#22252b">사용하려는 서비스</text>
    <g font-size="15" fill="#4a4f5c">
      <rect x="24" y="60" width="172" height="44" rx="12" fill="#eef2ff"/><text x="110" y="88" text-anchor="middle">Microsoft 365</text>
      <rect x="24" y="114" width="172" height="44" rx="12" fill="#eef2ff"/><text x="110" y="142" text-anchor="middle">Azure</text>
      <rect x="24" y="168" width="172" height="44" rx="12" fill="#eef2ff"/><text x="110" y="196" text-anchor="middle">외부 업무 서비스</text>
      <rect x="24" y="222" width="172" height="44" rx="12" fill="#eef2ff"/><text x="110" y="250" text-anchor="middle">사내 프로그램</text>
    </g>
  </g>

  <text x="480" y="414" text-anchor="middle" font-size="14" fill="#6b7080">모든 접속은 Entra ID의 확인을 거친 뒤에 서비스로 이어집니다.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a90a2"/>
    </marker>
  </defs>
</svg>
