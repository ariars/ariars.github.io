<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="960" height="360" rx="20" fill="#f6f7fb"/>
  <text x="480" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#22252b">다단계 인증(MFA) — 서로 다른 종류의 확인을 2가지 이상</text>

  <g text-anchor="middle">
    <g transform="translate(60,80)">
      <rect width="240" height="200" rx="18" fill="#ffffff" stroke="#d9dce6"/>
      <rect x="92" y="28" width="56" height="40" rx="8" fill="#eef2ff" stroke="#2f6bff" stroke-width="3"/>
      <text x="120" y="56" font-size="18" font-weight="800" fill="#2f6bff">***</text>
      <text x="120" y="108" font-size="19" font-weight="800" fill="#22252b">알고 있는 것</text>
      <text x="120" y="140" font-size="15" fill="#4a4f5c">비밀번호, PIN</text>
    </g>
    <g transform="translate(360,80)">
      <rect width="240" height="200" rx="18" fill="#ffffff" stroke="#d9dce6"/>
      <rect x="100" y="22" width="40" height="56" rx="8" fill="#eef2ff" stroke="#2f6bff" stroke-width="3"/>
      <circle cx="120" cy="68" r="3" fill="#2f6bff"/>
      <text x="120" y="108" font-size="19" font-weight="800" fill="#22252b">가지고 있는 것</text>
      <text x="120" y="140" font-size="15" fill="#4a4f5c">휴대폰 인증 앱, 보안 키</text>
    </g>
    <g transform="translate(660,80)">
      <rect width="240" height="200" rx="18" fill="#ffffff" stroke="#d9dce6"/>
      <circle cx="120" cy="50" r="26" fill="#eef2ff" stroke="#2f6bff" stroke-width="3"/>
      <circle cx="111" cy="46" r="3" fill="#2f6bff"/><circle cx="129" cy="46" r="3" fill="#2f6bff"/>
      <path d="M110 58 q10 8 20 0" stroke="#2f6bff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="120" y="108" font-size="19" font-weight="800" fill="#22252b">본인의 신체 특징</text>
      <text x="120" y="140" font-size="15" fill="#4a4f5c">얼굴, 지문</text>
    </g>
  </g>
  <text x="480" y="320" text-anchor="middle" font-size="15" fill="#4a4f5c">한 가지가 새어 나가도 나머지가 막아 주기 때문에 계정이 훨씬 안전해집니다.</text>
</svg>
