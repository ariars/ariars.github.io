<!DOCTYPE html>
<html lang="{{ site.lang | default: 'ko' }}" class="{% if page.url == '/' or page.is_home %}is-home{% endif %}">

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta http-equiv="Content-Language" content="ko">
  <meta name="google" content="notranslate">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.url == '/' %}{{ page.title | default: 'ariars.com' }}{% elsif page.title and page.title != 'ariars' %}{{ page.title }} – {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="canonical" href="{{ page.url | replace:'index.html','' | absolute_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Spectral:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap" rel="stylesheet">

  <script>
    const defaultTheme = "light";
    const isToggleEnabled = true;
    const userTheme = localStorage.getItem("theme");

    function setTheme(mode) {
      if (mode === "dark") {
        document.documentElement.setAttribute("dark", "");
        document.documentElement.classList.add("dark-mode");
      } else if (mode === "light") {
        document.documentElement.removeAttribute("dark");
        document.documentElement.classList.remove("dark-mode");
      }
    }

    if (isToggleEnabled) {
      if (userTheme) {
        setTheme(userTheme);
      } else {
        setTheme(defaultTheme);
      }
    } else {
      setTheme(defaultTheme);
    }

    if (localStorage.getItem("classView") === "list") {
      document.documentElement.setAttribute("list", "");
      document.documentElement.classList.add('view-list');
    }
  </script>

  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  {% if page.url == '/' %}{% seo title=false %}{% else %}{% seo %}{% endif %}
  {% if page.url == '/' or page.is_home %}
  <style>
    /* Home page full-height layout (header + full screen content) */
    html.is-home,
    body.is-home {
      height: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
      background-color: #202020 !important;
    }

    body.is-home .global-wrap {
      background-color: #202020 !important;
      color: #ffffff !important;
      height: 100% !important;
      height: 100dvh !important;
      min-height: 100dvh !important;
      display: flex !important;
      flex-direction: column !important;
      margin: 0 !important;
      padding: 0 !important;
      overflow: hidden !important;
    }

    body.is-home .content {
      background-color: #202020 !important;
      flex: 1 1 auto !important;
      height: 100% !important;
      min-height: 0 !important;
      position: relative !important;
      overflow: hidden !important;
      margin: 0 !important;
      padding: 0 !important;
    }

    body.is-home .top {
      display: none !important;
    }

    /* Header Common Structure & Wipe Animation (overflow: visible to allow mobile dropdown menu) */
    body.is-home .header {
      position: relative !important;
      background: transparent !important;
      border-bottom: none !important;
      margin-bottom: 0 !important;
      flex-shrink: 0 !important;
      overflow: visible !important;
      z-index: 100 !important;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4) !important;
    }

    body.is-home .header::before {
      content: "" !important;
      position: absolute !important;
      top: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 100% !important;
      transform-origin: left center !important;
      transform: scaleX(0);
      animation: headerBgWipe 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards !important;
      z-index: 0 !important;
    }

    body.is-home .header::after {
      content: "" !important;
      position: absolute !important;
      bottom: 0 !important;
      left: 0 !important;
      width: 100% !important;
      height: 1px !important;
      transform-origin: left center !important;
      transform: scaleX(0);
      animation: headerBgWipe 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards !important;
      z-index: 1 !important;
    }

    @keyframes headerBgWipe {
      0% {
        transform: scaleX(0);
      }
      100% {
        transform: scaleX(1);
      }
    }

    body.is-home .header .container,
    body.is-home .header__inner {
      position: relative !important;
      z-index: 2 !important;
    }

    /* --- Light Mode Header (White Wipe & Dark Elements) --- */
    html:not([dark]) body.is-home .header::before {
      background: #ffffff !important;
    }
    html:not([dark]) body.is-home .header::after {
      background: #ffffff !important;
    }
    html:not([dark]) body.is-home .header .logo__link,
    html:not([dark]) body.is-home .header .nav__link {
      color: #1a1a1a !important;
    }
    html:not([dark]) body.is-home .header .hamburger div,
    html:not([dark]) body.is-home .header .hamburger div::before,
    html:not([dark]) body.is-home .header .hamburger div::after {
      background-color: #1a1a1a !important;
    }
    html:not([dark]) body.is-home .header .nav-button .toggle-theme,
    html:not([dark]) body.is-home .header .nav-button .bookmark-toggle,
    html:not([dark]) body.is-home .header .nav-button .search-button {
      color: #1a1a1a !important;
    }
    html:not([dark]) body.is-home .header .nav-button svg {
      color: #1a1a1a !important;
    }
    html:not([dark]) body.is-home .header .nav-button svg path,
    html:not([dark]) body.is-home .header .nav-button svg circle {
      stroke: #1a1a1a !important;
    }
    html:not([dark]) body.is-home .header .nav-button .bookmark-toggle svg path {
      stroke: #1a1a1a !important;
    }
    html:not([dark]) body.is-home .header .nav-button .toggle-moon svg path,
    html:not([dark]) body.is-home .header .nav-button .search-button svg path {
      fill: none !important;
    }

    /* --- Dark Mode Header (Dark Wipe & Light Elements like /design/ page) --- */
    html[dark] body.is-home .header::before {
      background: var(--dark, #202020) !important;
    }
    html[dark] body.is-home .header::after {
      background: var(--border-color, #3e3e3e) !important;
    }
    html[dark] body.is-home .header .logo__link,
    html[dark] body.is-home .header .nav__link {
      color: var(--heading-font-color, #f0f0f0) !important;
    }
    html[dark] body.is-home .header .hamburger div,
    html[dark] body.is-home .header .hamburger div::before,
    html[dark] body.is-home .header .hamburger div::after {
      background-color: var(--heading-font-color, #f0f0f0) !important;
    }
    html[dark] body.is-home .header .nav-button .toggle-theme,
    html[dark] body.is-home .header .nav-button .bookmark-toggle,
    html[dark] body.is-home .header .nav-button .search-button {
      color: var(--heading-font-color, #f0f0f0) !important;
    }
    html[dark] body.is-home .header .nav-button svg {
      color: var(--heading-font-color, #f0f0f0) !important;
    }
    html[dark] body.is-home .header .nav-button svg path,
    html[dark] body.is-home .header .nav-button svg circle {
      stroke: var(--heading-font-color, #f0f0f0) !important;
    }
    html[dark] body.is-home .header .nav-button .bookmark-toggle svg path {
      stroke: var(--heading-font-color, #f0f0f0) !important;
    }
    html[dark] body.is-home .header .nav-button .toggle-sun svg path,
    html[dark] body.is-home .header .nav-button .toggle-sun svg circle,
    html[dark] body.is-home .header .nav-button .search-button svg path {
      fill: none !important;
    }

    /* Shared Quick Menu base */
    body.is-home .header .nav-button {
      display: flex !important;
      align-items: center !important;
      gap: 12px !important;
    }

    body.is-home .header .nav-button .toggle-theme,
    body.is-home .header .nav-button .bookmark-toggle,
    body.is-home .header .nav-button .search-button {
      background: transparent !important;
      border-radius: 0 !important;
      box-shadow: none !important;
      cursor: pointer !important;
      transition: color 0.2s ease !important;
    }

    body.is-home .header .nav__link:hover,
    body.is-home .header .nav-button .toggle-theme:hover,
    body.is-home .header .nav-button .bookmark-toggle:hover,
    body.is-home .header .nav-button .search-button:hover {
      color: var(--primary-color) !important;
      background: transparent !important;
      transform: none !important;
    }

    body.is-home .header .nav-button .toggle-theme:hover svg path,
    body.is-home .header .nav-button .toggle-theme:hover svg circle,
    body.is-home .header .nav-button .bookmark-toggle:hover svg path,
    body.is-home .header .nav-button .search-button:hover svg path {
      stroke: var(--primary-color) !important;
    }

    /* Staggered Blur Reveal */
    @keyframes blurReveal {
      0% {
        opacity: 0;
        filter: blur(14px);
        transform: translateY(-8px);
      }
      100% {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    /* 1. Logo */
    body.is-home .header .logo {
      opacity: 0;
      animation: blurReveal 0.65s cubic-bezier(0.25, 1, 0.5, 1) 0.3s forwards !important;
    }

    /* 2. Menu: Desktop animate main-nav, Mobile animate hamburger */
    @media (min-width: 1025px) {
      body.is-home .header .main-nav {
        opacity: 0;
        animation: blurReveal 0.65s cubic-bezier(0.25, 1, 0.5, 1) 0.55s forwards !important;
      }
    }

    @media (max-width: 1024px) {
      body.is-home .header .hamburger {
        display: flex !important;
        align-items: center !important;
        order: 1 !important;
        cursor: pointer !important;
        z-index: 10 !important;
        opacity: 0;
        animation: blurReveal 0.65s cubic-bezier(0.25, 1, 0.5, 1) 0.55s forwards !important;
      }

      body.is-home .header .nav-button {
        margin-left: auto !important;
      }

      body.is-home .header .main-nav {
        position: absolute !important;
        top: 64px !important;
        right: 16px !important;
        z-index: 1000 !important;
      }

      body.is-home .header .main-nav:not(.is-visible) {
        display: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }

      body.is-home .header .main-nav.is-visible {
        display: block !important;
        opacity: 1 !important;
        visibility: visible !important;
      }
    }

    /* 3. Quick Menu */
    body.is-home .header .nav-button {
      opacity: 0;
      animation: blurReveal 0.65s cubic-bezier(0.25, 1, 0.5, 1) 0.8s forwards !important;
    }
  </style>
  {% endif %}
</head>

<body class="{% if page.url == '/' or page.is_home %}is-home{% endif %}">

  <!-- begin global wrap -->
  <div class="global-wrap">
    <!-- begin header -->
    <header class="header" {% if page.hide_header_footer %}style="display: none !important;"{% endif %}>
      <div class="container">
        <div class="row">
          <div class="header__inner col col-12">

            <div class="logo">
              <a class="logo__link" href="{{ '/' | relative_url }}">
                {{ site.title | default: 'ariars' }}
              </a>
            </div>

            <div class="hamburger">
              <div></div>
            </div>

            <nav class="main-nav" aria-label="Main menu">
              <div class="main-nav__box">
                <ul class="nav__list list-reset">
                  <li class="nav__item">
                    <a href="{{ '/' | relative_url }}" class="nav__link {% if page.url == '/' %}active-link{% endif %}">Home</a>
                  </li>
                  <li class="nav__item">
                    <a href="{{ '/design/' | relative_url }}" class="nav__link {% if page.url contains '/design' %}active-link{% endif %}">Design</a>
                  </li>
                  <li class="nav__item">
                    <a href="{{ '/blog/' | relative_url }}" class="nav__link {% if page.url contains '/blog' %}active-link{% endif %}">Blog</a>
                  </li>
                  <li class="nav__item ">
                    <a href="{{ '/categories/' | relative_url }}" class="nav__link {% if page.url contains '/categories' or page.url contains '/categorys' %}active-link{% endif %}">Category</a>
                  </li>
                  <li class="nav__item">
                    <a href="{{ '/tags/' | relative_url }}" class="nav__link {% if page.url contains '/tags' %}active-link{% endif %}">Tag</a>
                  </li>
                </ul>
              </div>
            </nav>

            <div class="nav-button">
              <div class="color-scheme-button">
                <div class="toggle-theme">
                  <div class="toggle-moon" title="Enable dark mode" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 512 512"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="32" d="M160 136c0-30.62 4.51-61.61 16-88C99.57 81.27 48 159.32 48 248c0 119.29 96.71 216 216 216 88.68 0 166.73-51.57 200-128-26.39 11.49-57.38 16-88 16-119.29 0-216-96.71-216-216"/></svg>
                  </div>
                  <div class="toggle-sun" title="Enable light mode" aria-hidden="true">
                    <svg xmlns="http://www.w3.org/2000/svg" width="19" height="19" viewBox="0 0 512 512"><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-miterlimit="10" stroke-width="32" d="M256 48v48m0 320v48m147.08-355.08-33.94 33.94M142.86 369.14l-33.94 33.94M464 256h-48m-320 0H48m355.08 147.08-33.94-33.94M142.86 142.86l-33.94-33.94"/><circle cx="256" cy="256" r="80" fill="none" stroke="currentColor" stroke-linecap="round" stroke-miterlimit="10" stroke-width="32"/></svg>
                  </div>
                </div>
              </div>

              <a href="{{ '/bookmarks/' | relative_url }}" class="bookmark-toggle" id="bookmark-icon" aria-label="Saved bookmarks">
                <span id="bookmark-count"></span>
                <svg width="17px" height="17px" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                  <path d="M128,80V64a48.14,48.14,0,0,1,48-48H400a48.14,48.14,0,0,1,48,48V432l-80-64"
                    style="fill:none;stroke:var(--heading-font-color);stroke-linejoin:round;stroke-width:32px" />
                  <path d="M320,96H112a48.14,48.14,0,0,0-48,48V496L216,368,368,496V144A48.14,48.14,0,0,0,320,96Z"
                    style="fill:none;stroke:var(--heading-font-color);stroke-linejoin:round;stroke-width:32px" />
                </svg>
              </a>
              <div class="search-button">
                <svg class="search-button__icon" xmlns="http://www.w3.org/2000/svg" width="19px" height="19px" viewBox="0 0 512 512"><path d="M221.09 64a157.09 157.09 0 10157.09 157.09A157.1 157.1 0 00221.09 64z" fill="none" stroke="currentColor" stroke-miterlimit="10" stroke-width="32"/><path fill="none" stroke="currentColor" stroke-linecap="round" stroke-miterlimit="10" stroke-width="32" d="M338.29 338.29L448 448"/></svg>
              </div>
            </div>

          </div>
        </div>
      </div>

      <progress class="r-progress" value="0" max="100" data-progress=""></progress>
    </header>
    <!-- end header -->

    <!-- begin search -->
    <div class="search">
      <div class="container">
        <div class="row">
          <div class="col col-12">
            <div class="search__box">
              <div class="search__group">
                <i class="search__close fa-solid fa-xmark"></i>
                <label for="js-search-input" class="screen-reader-text">Search for Blog</label>
                <input type="text" id="js-search-input" class="search__text" autocomplete="off"
                  placeholder="Type to search...">
              </div>
              <div class="search-results-list" id="js-results-container"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="search__overlay"></div>
    </div>
    <!-- end search -->

    <!-- begin content -->
    <main class="content" aria-label="Content">
      {{ content }}
    </main>
    <!-- end content -->

    <!-- begin footer -->
    {% include footer.html %}
    <!-- end footer -->
  </div>
  <!-- end global wrap -->

  <div class="top" title="Top" {% if page.hide_header_footer %}style="display: none !important;"{% endif %}><i class="fa-solid fa-arrow-up"></i></div>

  <div class="images-overlay"></div>

  <script src="{{ '/assets/js/scripts.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/common.js' | relative_url }}"></script>
</body>

</html>
