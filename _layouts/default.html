<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ page.description | default: site.description | default: site.title }}">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    {% seo %}
  </head>
  <body class="shodo-body">
    <div class="site-shell">
      <header class="site-header" role="banner">
        <div class="brand">
          <a href="{{ '/' | relative_url }}">Shodo</a>
        </div>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="{{ '/' | relative_url }}">Home</a>
          <a href="{{ '/about.html' | relative_url }}">About</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        </nav>

        <a class="nav-cta" href="#featured">Featured</a>
      </header>

      <main id="content" class="site-content" role="main">
        {{ content }}
      </main>

      <footer class="site-footer">
        <div class="footer-brand">Shodo</div>
        <div class="footer-copy">© {{ 'now' | date: '%Y' }} Ariar's Blog</div>
        <div class="footer-links">
          <a href="https://github.com/ariars">GitHub</a>
          <a href="{{ '/feed.xml' | relative_url }}">RSS</a>
        </div>
      </footer>
    </div>
  </body>
</html>
