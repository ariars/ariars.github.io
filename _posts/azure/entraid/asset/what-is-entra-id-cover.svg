<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b3d"/>
      <stop offset="0.55" stop-color="#1d3a8a"/>
      <stop offset="1" stop-color="#5b4bc4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fb0ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fb0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="380" fill="url(#glow)"/>

  <!-- 연결선 -->
  <g stroke="#9cc0ff" stroke-opacity="0.45" stroke-width="2.5">
