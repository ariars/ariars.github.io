<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" font-family="Pretendard, 'Noto Sans KR', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">
  <rect width="960" height="440" rx="20" fill="#f6f7fb"/>
  <text x="480" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#22252b">애플리케이션 보안 통제와 모니터링 체계</text>

  <!-- 좌측: 보안 통제 (조건부 액세스) -->
  <g transform="translate(40, 80)">
    <rect width="425" height="320" rx="18" fill="#ffffff" stroke="#d9dce6" stroke-width="1.5"/>
    <text x="30" y="40" font-size="18" font-weight="800" fill="#22252b">접근 보안 통제</text>
    <text x="30" y="66" font-size="13" fill="#666d80">접속을 허용하기 전에 안전한 상태인지 다각도로 검증합니다.</text>

    <!-- 검증 항목 3개 -->
    <g transform="translate(25, 90)">
      <rect x="0" y="0" width="375" height="58" rx="10" fill="#f1f5f9"/>
      <text x="20" y="26" font-size="14" font-weight="700" fill="#1e293b">기기 상태 검증</text>
      <text x="20" y="46" font-size="12" fill="#64748b">회사가 보안을 인증한 정식 업무용 PC나 기기인가?</text>
    </g>

    <g transform="translate(25, 160)">
      <rect x="0" y="0" width="375" height="58" rx="10" fill="#f1f5f9"/>
      <text x="20" y="26" font-size="14" font-weight="700" fill="#1e293b">접속 장소 및 네트워크 검증</text>
      <text x="20" y="46" font-size="12" fill="#64748b">비정상적인 해외나 허용되지 않은 외부 네트워크인가?</text>
    </g>

    <g transform="translate(25, 230)">
      <rect x="0" y="0" width="375" height="58" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
      <text x="20" y="26" font-size="14" font-weight="700" fill="#1d4ed8">추가 본인 확인 요구 (MFA)</text>
      <text x="20" y="46" font-size="12" fill="#2563eb">중요 프로그램 접근 시 휴대폰 승인 등 2차 인증 필수</text>
    </g>
  </g>

  <!-- 우측: 모니터링 및 거버넌스 -->
  <g transform="translate(495, 80)">
    <rect width="425" height="320" rx="18" fill="#ffffff" stroke="#d9dce6" stroke-width="1.5"/>
    <text x="30" y="40" font-size="18" font-weight="800" fill="#22252b">활동 감시 및 정기 점검</text>
    <text x="30" y="66" font-size="13" fill="#666d80">모든 접속 행위를 투명하게 기록하고 이상 징후를 발견합니다.</text>

    <!-- 모니터링 항목 3개 -->
    <g transform="translate(25, 90)">
      <rect x="0" y="0" width="375" height="58" rx="10" fill="#f8fafc"/>
      <text x="20" y="26" font-size="14" font-weight="700" fill="#334155">로그인 기록 추적</text>
      <text x="20" y="46" font-size="12" fill="#64748b">누가, 몇 시에, 어떤 프로그램에 접속했는지 실시간 기록</text>
    </g>

    <g transform="translate(25, 160)">
      <rect x="0" y="0" width="375" height="58" rx="10" fill="#f8fafc"/>
      <text x="20" y="26" font-size="14" font-weight="700" fill="#334155">감사 로그 보관</text>
      <text x="20" y="46" font-size="12" fill="#64748b">관리자가 프로그램 설정을 변경하거나 권한을 부여한 내역 보존</text>
    </g>

    <g transform="translate(25, 230)">
      <rect x="0" y="0" width="375" height="58" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
      <text x="20" y="26" font-size="14" font-weight="700" fill="#b91c1c">미사용 권한 및 방치 프로그램 정리</text>
      <text x="20" y="46" font-size="12" fill="#dc2626">오랫동안 쓰지 않는 권한을 회수하고 계약 종료 앱 삭제</text>
    </g>
  </g>
</svg>
